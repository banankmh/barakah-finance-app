<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b2b"><meta name="description" content="بركة — إدارة مالية المنزل والشغل"><title>بركة | الإدارة المالية</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head><body>
<div id="toast" role="status" aria-live="polite"></div>
<section id="auth" class="auth-shell"><div class="auth-panel"><div class="brand big"><span class="brandmark">ب</span><span>بَرَكَة<small>إدارة مالية واضحة، بكل التفاصيل</small></span></div><h1>أهلًا بك في بركة</h1><p class="muted">حسابك الخاص، أعمالك ومشترياتك وتقاريرك في مكان واحد.</p><form id="authForm" class="stack"><label>البريد الإلكتروني<input id="email" type="email" autocomplete="email" required placeholder="name@example.com"></label><label>كلمة المرور<input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="••••••••"></label><button class="btn primary" id="authBtn" type="submit">تسجيل الدخول</button></form><button class="plain" id="switchAuth">ليس لديك حساب؟ إنشاء حساب</button><p class="muted tiny">قد يطلب Supabase تأكيد بريدك الإلكتروني قبل أول دخول.</p></div></section>
<div id="shell" class="shell hidden"><aside class="sidebar"><div class="brand"><span class="brandmark">ب</span><span>بَرَكَة<small>نظام المالية الذكي</small></span></div><div class="sidebar-label">مساحات العمل</div><select id="workspaceSelect" aria-label="مساحة العمل"></select><button class="side-add" id="newWorkspace">+ مساحة جديدة</button><div class="sidebar-label">القائمة الرئيسية</div><nav id="nav"><button data-page="dashboard" class="active">▦ <span>لوحة التحكم</span></button><button data-page="transactions">⇄ <span>الحركات المالية</span></button><button data-page="purchases">▤ <span>تفاصيل المشتريات</span></button><button data-page="projects">▣ <span>المشاريع والطلبات</span></button><button data-page="parties">♧ <span>الجهات والموردون</span></button><button data-page="accounts">▱ <span>الحسابات</span></button><button data-page="obligations">◷ <span>الديون والمستحقات</span></button><button data-page="reports">▥ <span>التقارير</span></button><button data-page="settings">⚙ <span>الإعدادات والمشاركة</span></button></nav><div class="sidebar-bottom"><span id="userEmail"></span><button id="logout" class="plain">تسجيل الخروج</button></div></aside><div class="main"><header class="topbar"><div><div class="eyebrow" id="spaceLabel">مساحة العمل</div><h1 id="pageTitle">لوحة التحكم</h1></div><div class="top-actions"><span class="connection" id="connection">● متصل</span><button class="btn primary" id="quickAdd">+ عملية جديدة</button></div></header><main id="content"></main></div></div>
<dialog id="dialog"><form id="editor" method="dialog"><header class="dialog-head"><h2 id="dialogTitle">إضافة</h2><button class="close" type="button" id="closeDialog" aria-label="إغلاق">×</button></header><div id="fields" class="form-grid"></div><footer class="form-footer"><button class="btn quiet" type="button" id="cancelDialog">إلغاء</button><button class="btn primary" id="saveDialog" type="submit">حفظ</button></footer></form></dialog>
<script src="app.js" defer></script></body></html>
